<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Rosetta - Sound it out</title>
</head>
<body>
<div id="body">
<menu id="nav">
    <li class="dropdown">≡</li>
    <li class="title"><em><a href="index.html">rosetta</a></em></li>
    <li class="extra"><a href="how-to-play.html">how to play</a></li>
    <li class="extra"><a href="https://noanimaltesting.org">noanimaltesting.org</a></li>
    <li class="extra login"><a href="login.html">log in</a></li>
</menu>
<div id="main">
    <div class="title-box">
        <div class="title-container">
            <div class="title" class="rounded">
                <h1 id="g">rosetta</h1>
                <div class="arrows">
                    <button id="leftArrow" onclick="leftArrow">&lt;</button>
                    <button id="rightArrow" onclick="rightArrow">&gt;</button>
                </div>
            </div>
            <h2 id="puzzle-id">x#000000 - example subtitle</h2>
        </div>
        <div class="divisor"></div>
    </div>  
    <div class="container">
        <div class="passage rounded">
            <h3 id="puzzle-title"></h3>
            <div id="puzzle-passage">
                <p></p>
            </div>
        </div>
        <div class="top">
        <table id="key" class="rounded">
                <tr>
                    <th>phrase</th>
                    <th>translation</th>
                </tr>
            </table>
        </div>
        <div class="right">
            <div class="question rounded">
                <h3 id="question-title"></h3>
                <ol id="question-list"></ol>
            </div>
        </div>
    </div>
    </div>
</div>
<button id="status">
    <div class="close">x</div>
    <p id="statusMsg"></p>
    <p id="dismiss">click anywhere to dismiss</p>
</button>
</div>    
</body>
<script type="module" src="script.js"></script>
</html>
